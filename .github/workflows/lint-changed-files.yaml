# Gjenbrukar lint-arbeidsflyten frå rapwhale, sjå
# https://github.com/Rapporteket/rapwhale/blob/main/.github/workflows/lint-changed-files.yaml
on:
  pull_request:
    branches: [main]
    paths: ["**.[rR]", "**.[qrR]md", "**.[rR]markdown", "**.[rR]nw", "**.[rR]profile", "**/lint-changed-files.yaml"]

name: lint-changed-files

jobs:
  lint-changed-files:
    uses: Rapporteket/rapwhale/.github/workflows/lint-changed-files.yaml@main
